<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàng Vinh | Personal Bio</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS Variables cho hệ màu linh hoạt */
        :root {
            --glow-orange: #ff7b00;
            --glow-purple: #9d4edd;
            --glow-cyan: #00f2fe;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-specular: rgba(255, 255, 255, 0.45);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        /* Reset mặc định */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            /* Hiệu ứng nền Aurora chuyển động */
            background: linear-gradient(125deg, #0a040d, #1f0824, #081026, #240c08, #05050a);
            background-size: 400% 400%;
            animation: dynamicAurora 14s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Keyframes cho chuyển động nền */
        @keyframes dynamicAurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Các khối sáng lỏng (Liquid Blobs) */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
            animation: blobFloat 10s ease-in-out infinite alternate;
        }

        .blob-1 { width: 320px; height: 320px; background: radial-gradient(circle, var(--glow-orange), var(--glow-purple)); top: 10%; left: -5%; }
        .blob-2 { width: 350px; height: 350px; background: radial-gradient(circle, var(--glow-cyan), var(--glow-purple)); bottom: 10%; right: -5%; animation-delay: -5s; }

        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.15); }
        }

        /* Container chính */
        .container { 
            width: 100%; 
            max-width: 410px; 
            position: relative; 
            z-index: 1;
            animation: glassAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Profile Card - Kính chiều sâu */
        .profile-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-specular);
            border-left: 1px solid var(--glass-specular);
            border-radius: 36px;
            padding: 34px 24px;
            text-align: center; 
            margin-bottom: 22px; 
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }
        
        .avatar-container {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 18px;
            padding: 3px;
            background: linear-gradient(135deg, var(--glow-orange), var(--glow-purple), var(--glow-cyan));
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.45);
        }

        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; border: 3px solid rgba(10, 5, 15, 0.85); }

        .name { font-size: 1.65rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
        .name span { background: linear-gradient(135deg, var(--glow-orange), var(--glow-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bio { font-size: 0.88rem; color: var(--text-sub); font-weight: 500; }

        /* Links List - Nút bấm */
        .links-wrapper { display: flex; flex-direction: column; gap: 13px; }

        .link-card {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 17px 22px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 26px;
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer; 
            position: relative; 
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .link-card:active { transform: scale(0.97) translateY(-2px); }

        .icon-box { 
            width: 42px; height: 42px;
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; color: #fff; 
            background: linear-gradient(135deg, rgba(255, 123, 0, 0.25), rgba(157, 78, 221, 0.25));
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .link-text { font-size: 0.98rem; font-weight: 600; margin-left: 16px; }
        .action-icon { color: var(--text-sub); font-size: 1.05rem; }

        /* MODAL FIX - Đảm bảo nằm giữa tuyệt đối */
        .modal {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100vw; 
            height: 100vh;
            background: rgba(5, 2, 10, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            align-items: center; 
            justify-content: center;
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.4s ease; 
            z-index: 9999;
            margin: 0;
            padding: 0;
        }

        .modal.active { opacity: 1; pointer-events: auto; }

        .modal-content { 
            background: linear-gradient(135deg, rgba(30, 10, 40, 0.95) 0%, rgba(10, 20, 35, 0.95) 100%); 
            padding: 32px 24px; 
            border-radius: 36px; 
            text-align: center; 
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            width: 90%;
            max-width: 320px;
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .modal.active .modal-content { transform: scale(1); }

        .qr-img { width: 220px; height: 220px; object-fit: contain; border-radius: 20px; margin: 18px 0; background: #fff; padding: 10px; }
        
        .close-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #fff; 
            padding: 12px 32px; 
            border-radius: 30px; 
            font-weight: 600; 
            cursor: pointer;
            margin-top: 5px;
        }

        @keyframes glassAppear {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    
    <div class="container">
        <div class="profile-card">
            <div class="avatar-container">
                <img src="https://lh3.googleusercontent.com/d/16zSR_l-U1zgnr-iJ4386T_aV97lzwF_f" alt="Hoàng Vinh" class="avatar">
            </div>
            <h1 class="name">Hoàng <span>Vinh</span></h1>
            <p class="bio">Tech Enthusiast & Digital Creator</p>
        </div>

        <div class="links-wrapper">
            <!-- Link 1 -->
            <div class="link-card" onclick="openModal('Messenger', 'https://lh3.googleusercontent.com/d/13VLhhdzwrIlZBqnu9pIQuD5bab5yU90H')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-brands fa-facebook-messenger"></i></div>
                    <span class="link-text">Messenger</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 2 -->
            <div class="link-card" onclick="openModal('Zalo', 'https://lh3.googleusercontent.com/d/1J1jfTGj7oyfNGEvUHhuxvfBYDRKzJI3J')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-solid fa-comment-dots"></i></div>
                    <span class="link-text">Zalo</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 3 -->
            <div class="link-card" onclick="openModal('TikTok', 'https://lh3.googleusercontent.com/d/18SCODUKu7aUgQMgQIdAJ-mNMEFqDJGr2')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
                    <span class="link-text">TikTok</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 4 -->
            <div class="link-card" onclick="openModal('Locket', 'https://lh3.googleusercontent.com/d/1vPfOZyggK_qVDScPV48zev63aS77a7Ca')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-solid fa-heart"></i></div>
                    <span class="link-text">Locket</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 5 -->
            <div class="link-card" onclick="openModal('Số điện thoại', 'https://lh3.googleusercontent.com/d/15qId5a5EJakZaJRqvVssaWaJD-_sEipg')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
                    <span class="link-text">Số điện thoại</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 6 -->
            <div class="link-card" onclick="openModal('MoMo', 'https://lh3.googleusercontent.com/d/1NTgJP4mjQznh_nEjTHpBrCGoMzv337uK')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
                    <span class="link-text">MoMo</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 7 -->
            <div class="link-card" onclick="openModal('WeChat', 'https://lh3.googleusercontent.com/d/14gr1gqQF2b2a5hFnQtP28hoF5k032QIV')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-brands fa-weixin"></i></div>
                    <span class="link-text">WeChat</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 8 -->
            <div class="link-card" onclick="openModal('Weibo', 'https://lh3.googleusercontent.com/d/1PzpT1WSdel8Bewjue5Wf_epYSKyury0t')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-brands fa-weibo"></i></div>
                    <span class="link-text">Weibo</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
            <!-- Link 9 -->
            <div class="link-card" onclick="openModal('Douyin', 'https://lh3.googleusercontent.com/d/1awOCZ_g4uuFYeYc-u066fKGIz0B5I2mA')">
                <div style="display:flex; align-items:center;">
                    <div class="icon-box"><i class="fa-solid fa-video"></i></div>
                    <span class="link-text">Douyin</span>
                </div>
                <i class="fa-solid fa-qrcode action-icon"></i>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div class="modal" id="qrModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle" style="color: var(--glow-cyan); margin-bottom: 10px;">Mã QR</h3>
            <img id="modalQr" src="" class="qr-img" alt="QR Code">
            <br>
            <button class="close-btn" onclick="closeModalDirect()">Đóng</button>
        </div>
    </div>

    <script>
        function openModal(title, url) {
            document.getElementById('modalTitle').innerText = 'Mã QR ' + title;
            document.getElementById('modalQr').src = url;
            document.getElementById('qrModal').classList.add('active');
        }
        function closeModal(event) { if (event.target.id === 'qrModal') document.getElementById('qrModal').classList.remove('active'); }
        function closeModalDirect() { document.getElementById('qrModal').classList.remove('active'); }
    </script>
</body>
</html>
